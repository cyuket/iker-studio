name: Render video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Video id (the directory name under output/)
        required: true
        type: string
      format:
        description: Which cuts to render
        required: true
        default: all
        type: choice
        options: [all, youtube-landscape, youtube-shorts, social-landscape, social-portrait]
      quality:
        description: Render quality
        required: true
        default: preview
        type: choice
        options: [preview, final]
      mode:
        description: full renders the cuts; scene re-renders one scene and rebuilds its cut
        required: true
        default: full
        type: choice
        options: [full, scene]
      scene:
        description: Scene id (only for mode "scene")
        required: false
        type: string
      export:
        description: After review, approve and export the final render to private R2 storage
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.video_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render and check
    runs-on: ubuntu-latest
    # A three-minute 1080p video renders in well under this on a standard runner. Longer
    # videos should be rendered per cut (the "format" input) to stay inside the job limit.
    timeout-minutes: 90
    env:
      VIDEO_ID: ${{ inputs.video_id }}
      FORMAT: ${{ inputs.format }}
      QUALITY: ${{ inputs.quality }}
      MODE: ${{ inputs.mode }}
      SCENE: ${{ inputs.scene }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
      IKER_DEMO_BASE_URL: ${{ vars.IKER_DEMO_BASE_URL }}
      IKER_DEMO_USERNAME: ${{ secrets.IKER_DEMO_USERNAME }}
      IKER_DEMO_PASSWORD: ${{ secrets.IKER_DEMO_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      REMOTION_LICENSE_KEY: ${{ secrets.REMOTION_LICENSE_KEY }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          case "$VIDEO_ID" in
            *[!a-z0-9-]*|"") echo "::error::video_id must be lowercase letters, digits and hyphens"; exit 1 ;;
          esac
          if [ "$MODE" = "scene" ]; then
            case "$SCENE" in
              *[!a-z0-9-]*|"") echo "::error::mode 'scene' needs a scene id of lowercase letters, digits and hyphens"; exit 1 ;;
            esac
          fi
          test -f "output/$VIDEO_ID/manifest.json" || { echo "::error::output/$VIDEO_ID/manifest.json is not in the repository"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg and browsers
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm exec playwright install --with-deps chromium

      - name: Check the environment
        run: pnpm studio doctor

      # Narration and recordings are not in Git. Fetch them when R2 is configured, so
      # audio that was already paid for is reused rather than generated again.
      - name: Fetch generated assets from private storage
        if: env.R2_BUCKET_NAME != ''
        run: pnpm studio storage pull --video "$VIDEO_ID"

      - name: Record product flows that are missing or out of date
        run: pnpm studio record --video "$VIDEO_ID"

      - name: Generate narration that is missing or out of date
        run: pnpm studio narrate --video "$VIDEO_ID"

      - name: Render
        run: |
          set -- --video "$VIDEO_ID" --quality "$QUALITY"
          if [ "$FORMAT" != "all" ]; then set -- "$@" --format "$FORMAT"; fi
          if [ "$MODE" = "scene" ]; then set -- "$@" --scene "$SCENE"; fi
          pnpm studio render "$@"

      - name: Quality checks
        run: |
          set -- --video "$VIDEO_ID" --quality "$QUALITY"
          if [ "$FORMAT" != "all" ]; then set -- "$@" --format "$FORMAT"; fi
          pnpm studio qa "$@"

      - name: Keep new narration for the next run
        if: env.R2_BUCKET_NAME != ''
        run: pnpm studio storage push --video "$VIDEO_ID"

      # The video directory travels as a short-lived artifact for review. Media never
      # enters the repository. Scene segments are left out: they are large and rebuildable.
      - name: Upload the render and QA report for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: video-${{ inputs.video_id }}-${{ inputs.quality }}
          path: |
            output/${{ inputs.video_id }}
            !output/${{ inputs.video_id }}/scenes
          retention-days: 7
          if-no-files-found: error

  export:
    name: Approve and export
    needs: render
    if: inputs.export && inputs.quality == 'final' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment with required reviewers in the repository settings. The job
    # waits there until a reviewer, having watched the artifact from the render job and read
    # its QA report, approves the deployment. That approval is the human release decision.
    environment: video-release
    env:
      VIDEO_ID: ${{ inputs.video_id }}
      FORMAT: ${{ inputs.format }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the reviewed render
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: video-${{ inputs.video_id }}-final
          path: output/${{ inputs.video_id }}

      # Fails if QA found failures, or warnings that were not acknowledged: warnings have to
      # be accepted deliberately, so that is done locally with --acknowledge-warnings.
      - name: Record the approval given in the environment gate
        env:
          # GitHub does not expose who approved the gate; the run page records the reviewer.
          APPROVER: Reviewer of GitHub environment video-release, run ${{ github.run_id }} (started by ${{ github.triggering_actor }})
        run: |
          set -- --video "$VIDEO_ID" --stage final --by "$APPROVER"
          if [ "$FORMAT" != "all" ]; then
            for cut in $(node -e 'const s=require("./output/"+process.argv[1]+"/storyboard.json");console.log(s.cuts.filter(c=>c.format===process.argv[2]).map(c=>c.id).join(" "))' "$VIDEO_ID" "$FORMAT"); do set -- "$@" --cut "$cut"; done
          fi
          pnpm studio approve "$@"

      - name: Export to private storage
        run: |
          set -- --video "$VIDEO_ID" --r2
          if [ "$FORMAT" != "all" ]; then
            for cut in $(node -e 'const s=require("./output/"+process.argv[1]+"/storyboard.json");console.log(s.cuts.filter(c=>c.format===process.argv[2]).map(c=>c.id).join(" "))' "$VIDEO_ID" "$FORMAT"); do set -- "$@" --cut "$cut"; done
          fi
          pnpm studio export "$@"
