name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI never needs to write to the repository, and it uses no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline stand-ins only. No paid API is ever called from this workflow.
  NODE_ENV: test
  LOG_FORMAT: pretty

jobs:
  validate:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build the CLI
        run: pnpm build

      - name: Validate templates
        run: pnpm studio templates validate

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the recording browser and its system libraries
        run: pnpm exec playwright install --with-deps chromium

      - name: Check the environment
        run: pnpm studio doctor

      - name: Integration tests (FFmpeg and Chromium, no secrets)
        run: pnpm test:integration

      # Records the synthetic fixture, narrates with silence, renders a short vertical cut
      # with Remotion, then validates the video metadata and the QA report.
      - name: Synthetic end-to-end render
        run: pnpm test:e2e
